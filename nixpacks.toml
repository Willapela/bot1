# nixpacks.toml
# Necessário porque o bot.py chama `node deobfuscate.js` via subprocess
# para rodar a sandbox de desofuscação (módulo `vm` do Node).

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python bot.py"
[phases.setup]

nixPkgs = ["python3", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm install -g webcrack"
]
